name: Frontend PR Checks

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  # Non-production placeholder values required at build time by Create React App.
  # These are public configuration, not secrets, and are not used interactively in CI.
  REACT_APP_API_URL: https://api.ci.invalid
  REACT_APP_ENTRA_TENANT_ID: 00000000-0000-0000-0000-000000000001
  REACT_APP_ENTRA_CLIENT_ID: 00000000-0000-0000-0000-000000000002
  REACT_APP_ENTRA_API_SCOPE: api://00000000-0000-0000-0000-000000000003/WasabiDrive.Access

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

      - name: Build
        run: npm run build
